<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>سَكَن | خدمات المنزل</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
	/* --- شاشة التحميل (Splash Screen) --- */
.splash-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(900px 520px at 90% -8%, #DFF3E8, transparent), var(--bg, #FAFBF8);
  transition: opacity 0.5s ease, visibility 0.5s ease;
  animation: hideSplash 0.5s ease 2.5s forwards; /* مدة الظهور قبل الاختفاء */
}

.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  animation: splashIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
}

.splash-logo-svg {
  width: 56px;
  height: 56px;
  filter: drop-shadow(0 8px 16px rgba(14, 107, 80, 0.15));
}

.splash-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--em, #0E6B50);
  margin: 0;
}

.splash-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--mut, #55655D);
  font-size: 0.9rem;
  font-weight: 500;
}

.splash-spinner {
  width: 24px;
  height: 24px;
  border: 2.5px solid var(--line, #DCE4DE);
  border-top-color: var(--em, #0E6B50);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes splashIn {
  from { opacity: 0; transform: translateY(14px) scale(0.96); }
  to { opacity: 1; transform: none; }
}

@keyframes hideSplash {
  to { opacity: 0; visibility: hidden; pointer-events: none; }
}

:root{--bg:#FAFBF8;--ink:#17261F;--mut:#55655D;--em:#0E6B50;--em2:#0A4F3B;--lf:#12865F;--mint:#DCF0E4;--mist:#EEF3EF;--line:#DCE4DE;--r:26px 8px 26px 8px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font:400 16px/1.85 'Readex Pro',system-ui,Tahoma,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 90% -8%,#DFF3E8,transparent),var(--bg);min-height:100vh;padding-bottom:110px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #2BA67A;outline-offset:3px;border-radius:10px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{width:min(1180px,100% - 32px);margin-inline:auto}
section.w{margin-top:72px}
h1,h2{font-weight:700;line-height:1.3}
h2{font-size:1.55rem;margin-bottom:6px}
.lead{color:var(--mut);max-width:62ch}
#prog{position:fixed;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,var(--em),#6CCB9E);transform-origin:right;transform:scaleX(0);z-index:90}
/* nav */
.top{display:flex;align-items:center;gap:24px;width:min(1180px,100% - 32px);margin:12px auto 0;padding:8px 4px;position:relative;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;margin-inline-end:auto}
.logo svg{width:36px;height:36px}
#tnav,.top>.btn{display:none}
.dock{position:fixed;inset-inline:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:4px;padding:8px;border-radius:30px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 40px -16px #0a4f3b88}
.dock a,#tnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;flex:1;min-height:56px;border-radius:22px;font-size:.72rem;color:var(--mut);transition:background .3s,color .3s}
.dock a[aria-current],#tnav a[aria-current]{background:var(--mint);color:var(--em2);font-weight:600}
.fab{display:none}
.lang{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font:500 .9rem 'Readex Pro',sans-serif;color:var(--em2);cursor:pointer;transition:background .25s}.lang:hover{background:var(--mint)}
[dir=ltr] #prog{transform-origin:left}[dir=ltr] .back .ic{transform:none}[dir=ltr] .hero .btn .ic{transform:scaleX(-1)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:0;border-radius:18px 6px 18px 6px;background:linear-gradient(135deg,var(--lf),var(--em2));color:#fff;font:600 1rem 'Readex Pro',sans-serif;cursor:pointer;box-shadow:0 14px 26px -14px var(--em2);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 28px -14px var(--em2)}.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--mint);color:var(--em2);box-shadow:none}
.badge{display:inline-flex;align-items:center;padding:2px 14px;border-radius:999px;background:var(--mint);color:var(--em2);font-size:.82rem;font-weight:500}
/* hero */
.hero{display:grid;gap:12px;align-items:center;margin-top:20px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);margin:14px 0 10px;letter-spacing:0}
.hero p{color:var(--mut);margin-bottom:26px;max-width:44ch}
.hero svg{width:100%;max-width:520px;margin-inline:auto}
.room{transform-box:fill-box;transform-origin:center;animation:lit .8s both var(--d)}
@keyframes lit{from{opacity:0;transform:scale(.86)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 8px;border-radius:var(--r);background:rgba(255,255,255,.7);border:1px solid var(--line);backdrop-filter:blur(10px);text-align:center}
.stats b{display:block;font-size:clamp(1.5rem,4vw,2.4rem);color:var(--em);line-height:1.2}
.stats span{font-size:.85rem;color:var(--mut)}
/* search + cards */
.search{display:flex;align-items:center;gap:10px;margin:22px 0;padding:0 18px;min-height:56px;border-radius:20px;background:#fff;border:1.5px solid var(--line);transition:border-color .3s,box-shadow .3s}
.search:focus-within{border-color:var(--lf);box-shadow:0 0 0 4px #12865f22}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;min-height:52px;outline:0;color:var(--ink)}
.grid{display:grid;gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;padding:16px;border-radius:var(--r);background:rgba(255,255,255,.78);border:1px solid var(--line);transition:transform .35s,box-shadow .35s,border-color .35s;animation:in .5s both calc(var(--i)*45ms)}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}}
.ico{grid-row:span 3;display:grid;place-items:center;width:56px;height:56px;border-radius:20px 6px 20px 6px;background:var(--mint);color:var(--em);transition:background .35s,color .35s,transform .35s}
.ico .ic{width:28px;height:28px}
.card b{font-size:1.05rem}.card p{font-size:.88rem;color:var(--mut);line-height:1.6}
.from{font-size:.85rem;color:var(--em);font-weight:600}
.card:hover{transform:translateY(-4px);border-color:#9AD3B8;box-shadow:0 22px 34px -22px var(--em2)}
.card:hover .ico{background:var(--em);color:#fff;transform:rotate(-6deg)}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px;border-radius:var(--r);background:var(--mist)}
.empty svg{width:120px;margin-bottom:8px}.empty .btn{margin-top:14px}
/* steps */
.steps{list-style:none;padding:0;margin-top:26px;display:grid;gap:22px;position:relative}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:0 18px}
.sico{grid-row:span 2;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;border:1.5px solid var(--line);color:var(--em);box-shadow:0 0 0 8px var(--mint)}
.steps p{color:var(--mut)}
/* detail */
.dgrid{display:grid;gap:26px;margin-top:20px}
.dmain>*+*{margin-top:18px}.dmain h2{margin-top:44px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);min-height:44px}.back .ic{transform:scaleX(-1)}
.vis{position:relative;display:grid;place-items:center;min-height:240px;border-radius:40px 10px 40px 10px;overflow:hidden;background:linear-gradient(145deg,#E6F6EC,#BFE5D0)}
.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vis .badge{position:absolute;top:16px;inset-inline-start:16px;background:#fffc}
.vart{display:grid;place-items:center;width:132px;height:132px;border-radius:44px 12px 44px 12px;background:#fff;color:var(--em);box-shadow:0 0 0 18px #ffffff66,0 0 0 40px #ffffff40}
.vart .ic{width:64px;height:64px;stroke-width:1.4}
.dmain h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.feat{list-style:none;padding:0;display:grid;gap:10px}
.feat li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--mist)}
.feat .ic{color:var(--lf)}
.revs{display:grid;gap:12px}
.rv1{padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.rv1 header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.av{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--em2);font-weight:700}
.rv1 small{color:var(--mut)}
.st{width:16px;height:16px;fill:#D5DDD8}.st.on{fill:var(--lf)}
.fq{border-bottom:1px solid var(--line)}
.q{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:58px;background:none;border:0;font:600 1rem 'Readex Pro',sans-serif;color:var(--ink);text-align:start;cursor:pointer;gap:12px}
.q .ic{transition:transform .35s;color:var(--lf)}.open .q .ic{transform:rotate(135deg)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.open .a{grid-template-rows:1fr}
.a>div{overflow:hidden;color:var(--mut)}.a p{padding-bottom:16px}
.bcard{padding:24px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:0 24px 40px -28px var(--em2)}
.bcard strong{display:block;font-size:2rem;color:var(--em);line-height:1.3}
.bcard ul{list-style:none;padding:0;margin:16px 0 20px;display:grid;gap:8px;color:var(--mut)}
.bcard li{display:flex;gap:10px;align-items:center}.bcard .btn{width:100%}
/* booking */
.bgrid{display:grid;gap:22px;margin-top:24px}
form{display:grid;gap:16px}
.fld label{display:block;font-weight:500;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;min-height:52px;padding:10px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);transition:border-color .25s,box-shadow .25s}
.fld textarea{min-height:100px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--lf);box-shadow:0 0 0 4px #12865f22}
.fld [aria-invalid=true]{border-color:#C2410C;animation:shake .35s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.err{display:block;min-height:0;color:#B23A0B;font-size:.85rem}
.sum{padding:24px;border-radius:var(--r);background:linear-gradient(160deg,#fff,var(--mist));border:1px solid var(--line);align-self:start}
.sum h2{font-size:1.2rem;margin-bottom:12px}
.sum dl{display:grid;gap:10px}.sum dt{font-size:.8rem;color:var(--mut)}.sum dd{font-weight:500;overflow-wrap:anywhere}
#acts{display:grid;gap:10px;margin-top:20px}
.rev form{display:none}.rev .bgrid{max-width:560px;margin-inline:auto}
/* dialog */
dialog{margin:auto;width:min(440px,100% - 32px);padding:32px 24px;border:0;border-radius:36px 10px 36px 10px;background:#fff;text-align:center;box-shadow:0 40px 80px -30px #0a2a20}
dialog[open]{animation:pop .5s cubic-bezier(.2,.9,.3,1.15)}
dialog::backdrop{background:#0a2a2088;backdrop-filter:blur(6px)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}}
dialog h2{margin:10px 0}dialog p{color:var(--mut)}.en{margin:10px 0 22px;font-size:.88rem}
.ok{width:84px;fill:var(--mint);stroke:var(--lf);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ok circle{stroke-dasharray:176;stroke-dashoffset:176;animation:dr .7s .15s forwards}
.ok path{fill:none;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .5s .65s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
/* skeleton + misc */
.sk{border-radius:20px;background:linear-gradient(90deg,#E9EFEB 25%,#F6F9F7 50%,#E9EFEB 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.page{animation:pg .5s both}@keyframes pg{from{opacity:0;transform:translateY(8px)}}
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}.rv.on{opacity:1;transform:none}
footer{margin:80px auto 0;text-align:center;color:var(--mut);font-size:.85rem}
/* tablet */
@media(min-width:700px){
 body{padding-bottom:40px}
 .top{position:sticky;top:10px;padding:8px 10px 8px 12px;margin-top:14px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 14px 32px -20px var(--em2)}
 .top>.btn{display:inline-flex;min-height:46px}
 #tnav{display:flex;gap:4px}#tnav a{flex-direction:row;gap:8px;padding:0 16px;min-height:46px;font-size:.92rem;border-radius:999px}#tnav .ic{width:20px;height:20px}
 .dock{display:none}
 .fab{display:grid;place-items:center;position:fixed;z-index:60;inset-inline-start:28px;bottom:28px;width:62px;height:62px;border-radius:24px 8px 24px 8px;background:var(--em);color:#fff;box-shadow:0 18px 30px -12px var(--em2);transition:transform .3s}.fab:hover{transform:scale(1.08) rotate(-4deg)}
 .hero{grid-template-columns:1.05fr .95fr;gap:24px}
 .grid{grid-template-columns:repeat(3,1fr);gap:16px}
 .card{grid-template-columns:1fr;padding:24px;align-items:start}.card .ico{grid-row:auto;width:64px;height:64px;margin-bottom:12px}
 .steps{grid-template-columns:repeat(3,1fr);gap:28px}.steps li{grid-template-columns:1fr;justify-items:start;gap:14px 0}.sico{grid-row:auto}
 .dgrid{grid-template-columns:1fr 300px}.side{position:sticky;top:96px;align-self:start}
 .feat,.revs{grid-template-columns:1fr 1fr}
 .bgrid{grid-template-columns:1fr 330px}form{grid-template-columns:1fr 1fr}.fld.full,form .btn{grid-column:1/-1}
 .sum{position:sticky;top:96px}
}
/* desktop */
@media(min-width:1100px){
 section.w{margin-top:110px}.grid{grid-template-columns:repeat(4,1fr)}
 .hero{grid-template-columns:1fr 1fr;margin-top:50px}
 .dgrid{grid-template-columns:1fr 360px;gap:48px}.vis{min-height:380px}
 .feat{grid-template-columns:repeat(3,1fr)}.related .grid{grid-template-columns:repeat(3,1fr)}
 .bgrid{grid-template-columns:1fr 380px;gap:48px}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>

function renderSum(){const d=data(),s=loc(find(d.service)),r=(k,v)=>`<div><dt>${t(k)}</dt><dd>${v?esc(v):'—'}</dd></div>`;
 $('#sum').innerHTML=r('lService',`${L(s.name)} — ${t('from')} ${money(s.price)}`)+r('lName',d.name)+r('lPhone',d.phone)+r('lPlace',[d.gov,d.area].filter(Boolean).join('، '))+r('lDate',d.date&&fdate(d.date,{weekday:'long',day:'numeric',month:'long'}))+r('lTime',d.time)+r('lNotes',d.notes)}
function review(on){$('#bk').classList.toggle('rev',on);$('#acts').hidden=!on;$('#bt').textContent=t(on?'revT':'bookT');renderSum();scrollTo({top:0})}
function done(){const d=$('#dlg');d.innerHTML=`<svg class="ok" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l9 9 16-18"/></svg><h2 id="dt">${t('okT')}</h2><p ${LANG==='en'?'style="margin-bottom:22px"':''}>${t('demoMsg')}</p>${LANG==='ar'?`<p class="en" lang="en" dir="ltr">${t('demoMsgEn')}</p>`:''}<button class="btn" id="close">${t('close')}</button>`;d.showModal()}
function counters(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.n,d=+el.dataset.d,f=v=>ar(v.toFixed(d)).replace('.',LANG==='ar'?'٫':'.');
 if(RM)return el.textContent=f(n);const t0=performance.now(),step=now=>{const p=Math.min((now-t0)/1200,1);el.textContent=f(n*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(step)};requestAnimationFrame(step)}),{threshold:.6});
 $$('.cnt').forEach(c=>io.observe(c))}
const drawGrid=q=>{const k=q.trim().toLowerCase(),l=SERVICES.filter(s=>{s=loc(s);return (s.name+s.desc+s.cat).toLowerCase().includes(k)});$('#grid').innerHTML=l.length?l.map(card).join(''):EMPTY()};
function init(p,id){
 if(p==='book'){const f=$('#f');f.addEventListener('input',renderSum);f.addEventListener('change',renderSum);f.addEventListener('submit',e=>{e.preventDefault();validate()&&review(true)});$('#edit').onclick=()=>review(false);$('#send').onclick=done;renderSum()}
 else if(p==='service'&&find(id)){}
 else{const q=$('#q');drawGrid('');q.addEventListener('input',()=>drawGrid(q.value));counters()}
 if(!RM){const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add('on'),io.unobserve(e.target))),{threshold:.12});$$('.page .stats,.page .steps,.page .revs').forEach(el=>{el.classList.add('rv');io.observe(el)})}}
let cur='',tm;
function route(){const[,p='',id]=location.hash.slice(1).split('/'),key=['','services','how'].includes(p)?'home':p+id;
 const nav=p==='book'?'book':p==='how'?'how':p==='services'||p==='service'?'services':'';
 $$('#tnav a,#dock a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.k===nav));
 $('#fab').href='#/book'+(p==='service'?'/'+id:'');$('#fab').hidden=p==='book';
 if(cur==='home'&&key==='home'){return p?$('#'+p).scrollIntoView():scrollTo({top:0})}
 cur=key;const app=$('#app');app.innerHTML=SKEL;app.setAttribute('aria-busy','true');clearTimeout(tm);
 tm=setTimeout(()=>{const s=find(id);app.innerHTML=`<div class="page">${p==='service'&&s?detail(s):p==='book'?book(id):home()}</div>`;app.removeAttribute('aria-busy');init(p==='service'&&!s?'':p,id);
  const a=p&&$('#'+p);a&&['services','how'].includes(p)?a.scrollIntoView():scrollTo(0,0);app.focus({preventScroll:true})},RM?0:320)}
/* ============ 7. BOOT ============ */
function applyLang(){const h=document.documentElement;h.lang=LANG;h.dir=t('dir');document.title=t('brand')+' | '+t('tag');
const nh=t('nav').map(([k,i,l])=>`<a href="#/${k}" data-k="${k}">${ic(i)}<span>${l}</span></a>`).join('');
$('#tnav').innerHTML=nh;$('#dock').innerHTML=nh;$('#tnav').setAttribute('aria-label',t('mainNav'));$('#dock').setAttribute('aria-label',t('dockNav'));
$('#brand').textContent=t('brand');$('#logo').setAttribute('aria-label',t('brand')+' - '+t('homeA'));$('#topbook').textContent=t('topBook');
$('#lang').textContent=t('lang');$('#lang').lang=LANG==='ar'?'en':'ar';$('#fab').innerHTML=ic('cal');$('#fab').setAttribute('aria-label',t('bookNow'));$('#foot').textContent=t('foot')}
document.addEventListener('click',e=>{const q=e.target.closest('.q');
 if(q){const o=q.parentElement.classList.toggle('open');q.setAttribute('aria-expanded',o)}
 if(e.target.closest('#clr')){$('#q').value='';drawGrid('')}
 if(e.target.id==='close'||e.target===$('#dlg'))$('#dlg').close()});
$('#dlg').addEventListener('close',()=>{location.hash='#/'});
addEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.transform=`scaleX(${scrollY/Math.max(h.scrollHeight-innerHeight,1)})`},{passive:true});
applyLang();$('#lang').onclick=()=>{LANG=LANG==='ar'?'en':'ar';applyLang();cur='';route()};
addEventListener('hashchange',route);route();
</script>
